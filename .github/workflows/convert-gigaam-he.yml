# Converts the Hebrew speech model GigaAM-He (asfberlin/fast-hebrew-asr, MIT)
# to ONNX for the style editor and publishes it as a release.
# Run from the Actions tab: "Convert GigaAM-He" -> "Run workflow".
name: Convert GigaAM-He

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        default: "gigaam-he-v2"
      args:
        description: "Extra arguments for scripts/convert_gigaam_he.py"
        default: "--no-fp16 --conv1x1-linear --split-mb 50"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      ARGS: ${{ inputs.args }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install libraries
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          pip install torch==2.14.1 torchaudio==2.11.0
          pip install onnx==1.19.1 onnxruntime==1.23.2 onnxconverter-common==1.16.0 huggingface_hub==2.1.1 numpy==2.5.3 soundfile
          pip install "gigaam @ git+https://github.com/salute-developers/GigaAM@7447938d791c4f3e643386ee22c33777004293a5"
          python -c "import torch, torchaudio, gigaam, onnx, onnxruntime; print('libraries ok', torch.__version__)"

      - name: Convert
        run: python scripts/convert_gigaam_he.py --out out $ARGS

      - name: Publish release
        if: always()
        run: |
          ls -la out || true
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "GigaAM-He Hebrew speech model (ONNX) - $TAG" \
              --notes "Converted from asfberlin/fast-hebrew-asr (MIT). Credits: GigaAM (MIT), HebDB (CC-BY-4.0), ivrit.ai crowd-transcribe-v5. See CREDITS.txt inside the zip. Parts (*.partNN) are plain byte splits of the zip; *.parts.json lists their sha256."
          fi
          shopt -s nullglob
          files=(out/*.zip out/*.part* out/*.parts.json out/convert_log.txt)
          if [ ${#files[@]} -gt 0 ]; then gh release upload "$TAG" "${files[@]}" --clobber; fi
          [ -n "$(ls out/*.zip 2>/dev/null)" ] || { echo "conversion failed - see convert_log.txt in the release"; exit 1; }
