# Measures a converted Hebrew model on real Hebrew speech (FLEURS he_il test),
# optionally against Whisper Base. Result: eval_log.txt in the given release.
name: Evaluate GigaAM-He

on:
  workflow_dispatch:
    inputs:
      clips:
        description: "Number of test clips"
        default: "150"
      model_url:
        description: "URL of the model zip to test"
        default: "https://github.com/netivdosIL/style-editor-models/releases/download/gigaam-he-v2/hebrew-gigaam-int8.zip"
      tag:
        description: "Release to attach eval_log.txt to"
        default: "gigaam-he-v2"
      skip_whisper:
        description: "1 = do not run Whisper Base"
        default: "1"

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      N_CLIPS: ${{ inputs.clips }}
      MODEL_URL: ${{ inputs.model_url }}
      SKIP_WHISPER: ${{ inputs.skip_whisper }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install onnxruntime==1.23.2 numpy==2.5.3 scipy soundfile huggingface_hub==2.1.1 sherpa-onnx

      - name: Evaluate
        run: python scripts/eval_he.py

      - name: Publish log
        if: always()
        run: |
          for f in out/eval_log.txt out/fleurs_he_samples.zip; do
            [ -f "$f" ] && gh release upload "$TAG" "$f" --clobber || true
          done
          cat out/eval_log.txt || true
