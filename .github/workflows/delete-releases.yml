# Deletes releases (and their tags) by name. Run from the Actions tab with a space-separated list of tags.
name: Delete releases
on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Tags to delete (space-separated)"
        required: true
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          for t in ${{ inputs.tags }}; do
            gh release delete "$t" --yes --cleanup-tag && echo "deleted $t" || echo "could not delete $t"
          done
