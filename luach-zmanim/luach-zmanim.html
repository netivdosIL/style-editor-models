<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>לוח זמנים</title>
<style>
:root{
  --bg:#f4f1ea;--card:#ffffff;--ink:#1d2433;--muted:#6b7280;--line:#e2dccf;
  --accent:#1f3a5f;--accent2:#2b4f7e;--gold:#b8862b;
  --yt:#fbeccb;--yt-ink:#6e4600;--chol:#fff6e3;--chol-ink:#7a5a12;
  --fast:#e6eaf1;--fast-ink:#3d4f6b;--minor:#e3f2e7;--minor-ink:#1e6b3a;
  --rc:#ede6f6;--rc-ink:#5b3d8a;--nat:#e1ecfa;--nat-ink:#1d4f91;
  --custom:#dcf2f0;--custom-ink:#0f6660;--bhz:#2f7d6d;--bhz-bg:#e5f3ef;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:15px}
button,select,input{font-family:inherit;font-size:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:16px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.titlebox{display:flex;align-items:center;gap:10px}
.navbtn{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center;color:var(--accent)}
.navbtn:hover{background:#eef2f7}
.navbtn svg{width:22px;height:22px}
.mtitle{text-align:center;min-width:230px}
.mtitle h1{margin:0;font-size:30px;color:var(--accent);letter-spacing:.3px}
.mtitle .sub{color:var(--muted);font-size:15px;margin-top:2px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:9px 14px;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--accent);color:#fff}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:10px;cursor:pointer;color:var(--ink)}
.btn:hover{background:#eef2f7}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:var(--accent2)}
.btn.danger{color:#a12a2a}
.wd{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.wd div{text-align:center;font-weight:700;color:var(--accent);padding:6px 0;background:#e9e4d8;border-radius:8px}
.wd div.sh{background:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cell{background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:122px;padding:6px 8px 6px;position:relative;cursor:pointer;display:flex;flex-direction:column;gap:3px;overflow:hidden;transition:box-shadow .15s}
.cell:hover{box-shadow:0 2px 10px rgba(31,58,95,.15)}
.cell.out{opacity:.42}
.cell.shabbat{background:#f8f4ea}
.cell.yomtov{background:var(--yt)}
.cell.chol{background:var(--chol)}
.cell.today{outline:3px solid var(--gold);outline-offset:-2px}
.cell.bhz{padding-top:22px}
.bhzband{position:absolute;top:0;right:0;left:0;height:17px;background:var(--bhz);color:#fff;font-size:11.5px;line-height:17px;padding:0 8px;white-space:nowrap;overflow:hidden}
.dn{display:flex;justify-content:space-between;align-items:center}
.hd{font-size:31px;font-weight:900;color:#13294a;line-height:1.05;letter-spacing:.5px}
.gwrap{display:flex;align-items:center;gap:4px;min-width:0}
.dn{min-width:0}.hd{flex:none}.gnum{flex:none}
.gwrap small{font-size:11px;color:var(--muted);font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.gnum{display:inline-grid;place-items:center;min-width:31px;height:31px;padding:0 4px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;font-size:15.5px}
.cell.shabbat .gnum{background:#6b4f1d}
.cell.today .gnum{background:var(--gold)}
#modeNote{font-size:13px;color:#7a5a12;background:#fff6e3;border:1px solid #f0dfb5;border-radius:8px;padding:6px 10px;margin-bottom:10px;display:none}
.gd{font-size:15px;color:var(--muted);font-weight:600}
.gd small{font-size:11px;font-weight:400}
.chip{font-size:12.5px;padding:2px 6px;border-radius:6px;line-height:1.3;font-weight:600}
.c-yomtov{background:#f3d79a;color:var(--yt-ink)}
.c-chol{background:#fde8bd;color:var(--chol-ink)}
.c-fast{background:var(--fast);color:var(--fast-ink)}
.c-minor{background:var(--minor);color:var(--minor-ink)}
.c-rc{background:var(--rc);color:var(--rc-ink)}
.c-national{background:var(--nat);color:var(--nat-ink)}
.c-custom{background:var(--custom);color:var(--custom-ink)}
.c-shabbat{background:#e9e4d8;color:var(--accent)}
.omer{margin-top:auto;font-size:11.5px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:12px;font-size:13px;color:var(--muted);align-items:center}
.legend span.sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-left:5px}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:14px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(20,28,40,.45);display:none;align-items:flex-start;justify-content:center;padding:30px 12px;z-index:50;overflow:auto}
.ov.open{display:flex}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:760px;box-shadow:0 10px 40px rgba(0,0,0,.25);overflow:hidden}
.modal.sm{max-width:460px}
.mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:var(--accent);color:#fff}
.mh h2{margin:0;font-size:19px}
.mh button{background:transparent;border:0;color:#fff;cursor:pointer;padding:4px}
.mh svg{width:22px;height:22px}
.mb{padding:16px 18px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:9px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;color:var(--muted);font-weight:600}
.tabs button.on{color:var(--accent);border-bottom-color:var(--gold)}
.grp{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.grp h3{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:center;color:var(--accent)}
.grp h3 .lnk{font-size:12.5px;font-weight:400;color:var(--accent2);cursor:pointer;text-decoration:underline;margin-right:10px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px 12px}
.checks label{display:flex;gap:6px;align-items:center;cursor:pointer}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.row input[type=text]{flex:1;min-width:140px;padding:7px 9px;border:1px solid var(--line);border-radius:8px}
.row select{padding:7px 6px;border:1px solid var(--line);border-radius:8px;background:#fff}
.list .item{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px dashed var(--line)}
.list .item:last-child{border-bottom:0}
.muted{color:var(--muted);font-size:13px}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
.dayinfo .big{font-size:22px;font-weight:800;color:var(--accent)}
.dayinfo .chips{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.dayinfo .chip{font-size:14.5px;padding:6px 10px}
.ico{width:18px;height:18px}
.wrap.fs{max-width:none;height:calc(100vh / var(--z,1));display:flex;flex-direction:column;padding:10px 14px}
.wrap.fs header.top{margin-bottom:8px}
.wrap.fs .grid{flex:1;min-height:0;grid-auto-rows:1fr}
.wrap.fs .cell{min-height:0}
.wrap.fs footer,.wrap.fs #modeNote{display:none!important}
.wrap.fs .legend{display:none}
.wrap.fs .tools .btn{padding:9px 11px}
.wrap.fs .tools .btn.lbl-hide span.t{display:none}
.wrap.fs .hd{font-size:26px}
.wrap.fs .chip{font-size:11.5px;padding:1px 5px}
.wrap.fs .cell{gap:2px;padding:5px 7px}
.wrap.fs .cell.bhz{padding-top:21px}
.wrap.fs .wd div{padding:4px 0}
.wrap.fs .mtitle h1{font-size:26px}
.ui-size-menu{position:fixed;z-index:3000;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px;box-shadow:0 8px 24px rgba(0,0,0,.18);min-width:170px}
.ui-size-menu button{display:flex;gap:8px;align-items:center;width:100%;background:none;border:0;color:var(--ink);padding:8px 10px;border-radius:7px;cursor:pointer;font:inherit;font-size:14.5px;text-align:right}
.ui-size-menu button:hover,.ui-size-menu button:focus{background:#eef2f7;outline:none}
.ui-size-menu .mk{width:14px;color:var(--gold);font-weight:800}
.ui-size-menu .pc{margin-inline-start:auto;color:var(--muted);font-size:12.5px}
.ci{width:13px;height:13px;vertical-align:-2px;margin-left:3px;flex:none}
.c-yahr{background:#efe6d6;color:#5a4220}
.c-bday{background:#fde3ec;color:#9b2350}
.c-rem{background:#e3eefc;color:#1d4f91}
.c-anniv{background:#fbe9d2;color:#8a2f4d}
.c-trip{background:#d9f1e6;color:#17604a}
.c-zman{background:#e7eef8;color:#1f3a5f}
.zsun{font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:0 8px;line-height:1.45}
.zsun b{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.zcell{display:flex;gap:5px;align-items:center;margin-inline-start:auto;font-size:13px;color:var(--accent);white-space:nowrap}
.ztable{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;margin-top:6px;font-size:14px}
.ztable div{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line);padding:3px 0}
.ztable div.zb{color:var(--accent);font-weight:700}
.ztable b{font-variant-numeric:tabular-nums}
@media (max-width:600px){.ztable{grid-template-columns:1fr}}
.c-hil{background:#f6f1e7;color:#7a6440;font-weight:500}
.hil-list{max-height:330px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:2px 10px;margin-top:12px}
.hil-row{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.hil-row:last-child{border-bottom:0}
.hil-row .st{cursor:pointer;flex:none;background:none;border:0;padding:0}
.hil-row .d{color:var(--muted);min-width:78px;font-size:13px}
.hil-row.on{background:#fff8e6}
.frm{display:grid;grid-template-columns:130px 1fr;gap:10px 12px;align-items:center}
.frm>label{font-weight:600;color:var(--accent)}
.frm input[type=text],.frm input[type=number],.frm select,.frm textarea{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;min-width:0}
.frm .inl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.frm .full{grid-column:1/-1}
.lnk2{color:var(--accent2);cursor:pointer;text-decoration:underline;font-size:13px}
textarea.imp{width:100%;min-height:200px;padding:9px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:14px;line-height:1.6}
.msg{padding:8px 10px;border-radius:8px;font-size:13.5px;margin-top:8px}
.msg.ok{background:#e3f2e7;color:#1e6b3a}.msg.err{background:#fbe7e7;color:#8a1f1f}
.ev-row{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.ev-row .nm{font-weight:700;flex:1;min-width:140px}
.ev-row .dt{color:var(--muted);font-size:13px;min-width:150px}
.btn.sm{padding:5px 10px;font-size:13px}
@media (max-width:600px){.frm{grid-template-columns:1fr}}
@media (max-width:760px){
  .cell{min-height:78px;padding:4px}
  .hd{font-size:19px}.gnum{min-width:22px;height:22px;font-size:12px}.gwrap small{display:none}
  .chip{font-size:10.5px;padding:1px 3px}
  .omer{display:none}
  .mtitle h1{font-size:22px}
  .wd div{font-size:12px}
}

/* ===== פס תצוגה עליון + תצוגות יום / שבוע / חודש ===== */
.modebar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--accent);color:#fff;border-radius:12px;padding:6px 10px;margin-bottom:10px}
.modebar .grp2{display:flex;gap:8px;align-items:center}
.modebar .lbl{font-size:13px;opacity:.8}
.mseg{display:inline-flex;border-radius:9px;overflow:hidden;background:rgba(255,255,255,.14)}
.mseg button{border:0;background:transparent;color:#fff;padding:7px 16px;cursor:pointer;font-weight:600}
.mseg button:hover{background:rgba(255,255,255,.2)}
.mseg button.on{background:#fff;color:var(--accent)}
.m-day .wd,.m-day .legend,.m-week .legend,.m-day .tools .seg,.m-week .tools .seg{display:none}
.grid.g-day{display:block;overflow:auto}
.daypanel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:12px;min-height:100%}
.dp-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 20px}
.dp-card.today{outline:3px solid var(--gold);outline-offset:-2px}
.dp-card.shabbat{background:#f8f4ea}.dp-card.yomtov{background:var(--yt)}.dp-card.chol{background:var(--chol)}
.dp-hd{font-size:46px;font-weight:900;color:#13294a;line-height:1.1}
.dp-gd{font-size:20px;color:var(--muted);font-weight:600;margin:4px 0 12px}
.dp-chips{display:flex;flex-direction:column;gap:6px}
.dp-chips .chip{font-size:16px;padding:6px 10px}
.dp-hl{font-size:14px;color:var(--muted);margin-top:10px;line-height:1.6}
.sunrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.suntile{border-radius:12px;padding:10px 14px;text-align:center;background:#fbeccb;color:#6e4600}
.suntile.set{background:#e7eef8;color:#1f3a5f}
.suntile .k{font-size:16px;font-weight:700}
.suntile .v{font-size:40px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
.daypanel .ztable{font-size:16px;margin-top:0}
.ztable div.nx{background:#fff6e3;color:#7a5a12;font-weight:800;border-radius:6px;padding-inline:6px}
.dp-act{margin-top:14px}
.g-week .cell{min-height:260px}
.g-week .hd{font-size:34px}
.g-week .chip{font-size:14px}
.g-week .zsun{font-size:14px}
.g-week .chip.c-hil,.g-week .chip.c-yahr{font-size:12px}
.wrap.fs .g-day{overflow:auto}
.wrap.fs .dp-hd{font-size:clamp(46px,6vw,96px)}
.wrap.fs .dp-gd{font-size:clamp(20px,2.3vw,34px)}
.wrap.fs .dp-chips .chip{font-size:clamp(16px,1.9vw,28px)}
.wrap.fs .suntile .k{font-size:clamp(16px,1.8vw,26px)}
.wrap.fs .suntile .v{font-size:clamp(40px,5.5vw,84px)}
.wrap.fs .daypanel .ztable{font-size:clamp(16px,1.9vw,28px)}
.wrap.fs .g-week .chip{font-size:14px}
.wrap.fs .modebar{padding:4px 8px;margin-bottom:6px}
#fsBtn{display:none}
@media (max-width:860px){.daypanel{grid-template-columns:1fr}.dp-hd{font-size:36px}.tools .btn span.t{display:none}.modebar .lbl{display:none}}
/* ===== ווידג'ט צף (נפתח עם #widget בכתובת) ===== */
body.wbody{margin:0;overflow:hidden;background:#1a3253}
.wrap.widget{max-width:none;padding:0;height:100vh;overflow:hidden}
.wrap.widget.w-day>*:not(#wgt):not(#wCtl){display:none!important}
.wrap.widget:not(.w-day){padding:8px 10px;overflow:auto;background:#f4f1ea}
.wrap.widget:not(.w-day) #wgt,.wrap.widget:not(.w-day) footer{display:none!important}
.wrap.widget .modebar .grp2:last-child,.wrap.widget .modebar .lbl{display:none}
.wrap.widget:not(.w-day) .modebar{padding-left:46px}
#wCtl{display:none}.wrap.widget #wCtl{display:block}
#wgt{display:none;position:relative;height:100vh;color:#fff;overflow:hidden;user-select:none;-webkit-user-select:none;background:linear-gradient(165deg,#18304f 0%,#25476e 62%,#1d3858 100%)}
.wrap.widget #wgt{display:block}
#wBody{padding:.9em 1em;font-size:15px;line-height:1.25}
.wtop{display:flex;justify-content:space-between;align-items:flex-end;gap:.5em;min-height:calc(1.4em + 30px)}
.wd1{min-width:0}
.wd1{cursor:pointer}
.wclk{font-size:2.6em;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;color:#ffd987;white-space:nowrap}
.wclk small{font-size:.42em;font-weight:600;opacity:.75}
.wh{font-size:1.55em;font-weight:900;line-height:1.1;letter-spacing:.2px}
.ws{font-size:.8em;opacity:.8;margin-top:.15em}
.wch{display:flex;flex-wrap:wrap;gap:.3em;margin-top:.5em}
.wch .chip{font-size:.8em;padding:.1em .55em;border-radius:1em}
.wch .chip.more{background:rgba(255,255,255,.18);color:#fff}
.whl{font-size:.8em;line-height:1.35;margin-top:auto;padding-top:.7em;color:#e8dcc0}.whl b{color:#ffd987}
.whl.lst{font-size:.85em}.whl.lst b{display:block;margin-bottom:.15em}.whl.lst div{padding:.06em 0}.whl .mut,.whl.lst .mut{opacity:.6}
#wBody{display:flex;flex-direction:column;min-height:100vh;box-sizing:border-box}
.wnx{font-size:.85em;margin-top:.5em;color:#ffd987}
.wsun{display:flex;gap:.5em;margin-top:.6em}
.wsun div{flex:1;border-radius:.7em;padding:.35em .2em;text-align:center;background:rgba(255,255,255,.1)}
.wsun small{display:block;font-size:.72em;opacity:.85;line-height:1.1}
.wsun b{display:block;font-size:1.5em;font-variant-numeric:tabular-nums;line-height:1.1}
.wsun .a b{color:#ffd987}.wsun .c{background:rgba(184,134,43,.35)}
.wstrip{display:flex;align-items:stretch;gap:.2em;margin-top:.7em}
.wk{flex:1;text-align:center;border-radius:.7em;padding:.25em 0 .2em;cursor:pointer;position:relative}
.wk i{display:block;font-style:normal;font-size:.7em;opacity:.7}
.wk b{display:block;font-size:1.05em}.wk small{display:block;font-size:.65em;opacity:.6}
.wk u{display:block;width:.35em;height:.35em;border-radius:50%;margin:.1em auto 0}.wk u.on{background:#ffd987}
.wk.sh{background:rgba(255,255,255,.07)}.wk.hol{background:rgba(184,134,43,.3)}
.wk.s{box-shadow:inset 0 0 0 .13em rgba(255,255,255,.7)}
.wk.t b{background:#b8862b;border-radius:50%;width:1.6em;height:1.6em;line-height:1.6em;margin:0 auto}
.wa{border:0;background:none;color:#fff;opacity:.55;font-size:1.3em;cursor:pointer;padding:0 .15em}.wa:hover{opacity:1}
.wtm{display:grid;grid-template-columns:1fr 1fr;gap:.05em 1em;margin-top:.6em;font-size:.88em}
.wtm div{display:flex;justify-content:space-between;padding:.12em 0;border-bottom:1px dotted rgba(255,255,255,.18)}
.wtm b{font-variant-numeric:tabular-nums}.wtm .nx{color:#ffd987;font-weight:700}
.wup{margin-top:.7em;border-top:1px solid rgba(255,255,255,.15);padding-top:.4em}
.wup .u{display:flex;justify-content:space-between;gap:.5em;font-size:.88em;padding:.15em 0}
.wup .u em{font-style:normal;opacity:.65;white-space:nowrap}
#wKnob{position:fixed;left:8px;top:8px;width:20px;height:20px;border-radius:50%;cursor:grab;z-index:50;touch-action:none;background:radial-gradient(circle at 35% 30%,#ffe6a8,#b8862b);box-shadow:0 0 0 2px rgba(255,255,255,.35);opacity:.9}
#wKnob:hover{opacity:1;box-shadow:0 0 0 3px rgba(255,255,255,.6)}
#wGrip{position:fixed;right:3px;bottom:3px;width:16px;height:16px;cursor:nwse-resize;z-index:50;touch-action:none;border-right:3px solid rgba(255,255,255,.5);border-bottom:3px solid rgba(255,255,255,.5);border-radius:0 0 6px 0}
.wrap.locked #wKnob{background:#8f9db0;opacity:.35;cursor:pointer;box-shadow:none}.wrap.locked #wKnob:hover{opacity:.9}
.wrap.locked #wGrip{display:none}
#wTabs{display:none;position:fixed;left:8px;bottom:8px;gap:4px;z-index:50}.wrap.widget.w-day #wTabs{display:flex}
#wTabs button{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:9px;padding:3px 10px;font-size:12px;cursor:pointer}#wTabs button:hover{background:rgba(255,255,255,.3)}

.sc-bar{background:linear-gradient(180deg,#1f3a5f,#26466f);color:#fff;padding:8px 14px 10px;user-select:none}

.sc-add{border:0;background:#ffd987;color:#3b2a00;font:inherit;font-weight:800;font-size:15px;height:38px;padding:0 18px;border-radius:10px;cursor:pointer}
.sc-add:hover{background:#ffe3a6}
.sc-wb{display:none;gap:4px}
body.scwv .sc-wb{display:flex}
.sc-wb button{border:0;background:rgba(255,255,255,.12);color:#fff;width:34px;height:30px;border-radius:8px;cursor:pointer;font-size:15px;line-height:1}
.sc-wb button:hover{background:rgba(255,255,255,.28)}
.sc-wb #scClose:hover{background:#e11d48}
body.scwv .sc-bar{cursor:move}
.sc-scroll{flex:1;overflow:auto;padding:0 12px 12px;position:relative}
.sc-head{display:grid;position:sticky;top:0;z-index:5;background:#f4f1ea;padding-top:10px;padding-bottom:2px}
.sc-dh{text-align:center;padding:6px 2px 7px;border-radius:12px;margin:0 3px;background:#ebe6d8;cursor:pointer;line-height:1.2}
.sc-dh:hover{background:#e2dcc9}
.sc-dh b{display:block;font-size:14px}
.sc-dh .n{display:block;font-size:22px;font-weight:800;color:#1f3a5f;line-height:1.15}
.sc-dh small{color:#6b7280;font-size:12px}
.sc-dh.t{background:#1f3a5f;color:#fff}.sc-dh.t .n{color:#ffd987}.sc-dh.t small{color:#cfd8e6}
.sc-dh.sh{background:#e6dcc0}.sc-dh.t.sh{background:#1f3a5f}
.sc-body{display:grid;position:relative;margin-top:6px}
.sc-hours{position:relative}
.sc-hours span{position:absolute;right:8px;font-size:12px;color:#6b7280;transform:translateY(-50%);font-variant-numeric:tabular-nums}
.sc-col{position:relative;margin:0 3px;border-radius:10px;background-color:#fff;border:1px solid #e2dccf;cursor:cell;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hh)/2 - 1px),#f3efe5 calc(var(--hh)/2 - 1px),#f3efe5 calc(var(--hh)/2),transparent calc(var(--hh)/2),transparent calc(var(--hh) - 1px),#e8e2d3 calc(var(--hh) - 1px),#e8e2d3 var(--hh))}
.sc-col.t{background-color:#fffcef}.sc-col.sh{background-color:#faf6ea}
.sc-blk{position:absolute;box-sizing:border-box;border-radius:9px;padding:5px 8px;overflow:hidden;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.55);font-size:13px;line-height:1.25;transition:transform .08s,box-shadow .08s}

.sc-blk b{display:block;font-size:14px}.sc-blk small{display:block;opacity:.92;font-size:12px;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;text-align:right;white-space:nowrap}

.sc-now{position:absolute;left:0;right:0;height:0;border-top:2px solid #e11d48;z-index:3;pointer-events:none}
.sc-now:before{content:"";position:absolute;right:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:#e11d48}
.sc-mh{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));position:sticky;top:0;z-index:5;background:#f4f1ea;padding-top:10px}
.sc-mh div{text-align:center;font-weight:800;font-size:14px;color:#1f3a5f;padding:6px 0;margin:0 3px;background:#ebe6d8;border-radius:10px}
.sc-mh div.sh{background:#e6dcc0}
.sc-month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:6px;min-height:calc(100% - 52px)}
.sc-cell{background:#fff;border:1px solid #e2dccf;border-radius:11px;padding:5px 6px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}

.sc-cell.out{background:#f1eee5;opacity:.7}
.sc-cell.sh{background:#faf6ea}.sc-cell.out.sh{background:#eee9db}
.sc-cell.t{outline:2px solid #1f3a5f;background:#fffcef}
.sc-cd{display:flex;align-items:baseline;gap:6px}
.sc-cd b{font-size:17px;color:#1f3a5f}.sc-cd small{font-size:11.5px;color:#6b7280}
.sc-cell.t .sc-cd b{background:#1f3a5f;color:#ffd987;border-radius:50%;min-width:26px;height:26px;display:inline-grid;place-items:center;font-size:15px}
.sc-plus{margin-inline-start:auto;font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#ebe6d8;color:#1f3a5f;font-weight:800;font-size:15px;opacity:0}
.sc-cell:hover .sc-plus{opacity:1}.sc-plus:hover{background:#1f3a5f;color:#fff}
.sc-chip{border-radius:7px;padding:2px 7px;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.sc-chip span{opacity:.85;font-weight:500;font-variant-numeric:tabular-nums}
.sc-chip:hover{filter:brightness(1.08)}
.sc-more{font-size:12px;color:#6b7280;padding:0 4px}
.sc-grip{position:absolute;right:0;bottom:0;width:22px;height:22px;cursor:nwse-resize;z-index:50;display:none;
  background:linear-gradient(135deg,transparent 52%,#9aa7b8 52%,#9aa7b8 60%,transparent 60%,transparent 72%,#9aa7b8 72%,#9aa7b8 80%,transparent 80%)}
body.scwv .sc-grip{display:block}
.sc-modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:100;align-items:center;justify-content:center}
.sc-modal.open{display:flex}
.sc-box{background:#fff;border-radius:16px;padding:18px 22px;width:min(480px,94vw);max-height:92vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.sc-box h3{margin:0 0 6px;font-size:19px;color:#1f3a5f}
.sc-box label{display:block;font-size:13px;color:#5b6475;margin:11px 0 4px}
.sc-box input[type=text],.sc-box input[type=date],.sc-box textarea,.sc-box select,.sc-box input[type=time]{width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid #d9d2c0;border-radius:10px;font:inherit}
.sc-box textarea{height:56px;resize:vertical}
.sc-row{display:flex;gap:12px;align-items:flex-end}.sc-row>div{flex:1}
.sc-hd{font-size:13px;color:#1f3a5f;font-weight:700;padding-bottom:10px}
.sc-seg{display:flex;border:1px solid #d9d2c0;border-radius:10px;overflow:hidden}
.sc-seg button{flex:1;padding:8px 0;border:0;background:#fff;font:inherit;font-weight:700;cursor:pointer}
.sc-seg button.on{background:#1f3a5f;color:#fff}
.sc-days{display:flex;gap:5px}.sc-days button{flex:1;padding:8px 0;border:1px solid #d9d2c0;background:#fff;border-radius:10px;cursor:pointer;font:inherit;font-weight:700}
.sc-days button.on{background:#1f3a5f;color:#fff;border-color:transparent}
.sc-sw{display:flex;gap:8px;flex-wrap:wrap}.sc-sw i{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid #fff;box-shadow:0 0 0 1px #cfc8b6}
.sc-sw i.on{box-shadow:0 0 0 3px #1d2433}
.sc-chk{display:flex;align-items:center;gap:8px;margin:10px 0 0;font-size:14px;color:#1d2433!important}
.sc-chk input{width:18px;height:18px}
.sc-act{display:flex;gap:8px;margin-top:18px}.sc-act .btn{flex:1;justify-content:center}.sc-act .del{flex:none;color:#b91c1c}
.sc-err{color:#b91c1c;font-size:13px;min-height:1em;margin-top:8px}
.wrap.widget #wMenu .sep{height:1px;background:#e8e3d6;margin:3px 4px}
@media print{
  @page{size:A4 landscape;margin:8mm}

  .cell{min-height:92px;break-inside:avoid;box-shadow:none!important}
  .cell.today{outline:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

const WIDGET=location.hash==='#widget',SCHED=location.hash==='#schedule';
const EPOCH=-1373427;               // ראש השנה א' (ימים רציפים)
const UNIX_RD=719163;               // 1/1/1970
function leap(y){return (7*y+1)%19<7}
function lastMonth(y){return leap(y)?13:12}
const _ed={};
function elapsed(y){
  if(_ed[y]!=null)return _ed[y];
  const m=Math.floor((235*y-234)/19);
  const parts=12084+13753*m;
  let d=29*m+Math.floor(parts/25920);
  if((3*(d+1))%7<3)d++;
  return _ed[y]=d;
}
function corr(y){const a=elapsed(y-1),b=elapsed(y),c=elapsed(y+1);if(c-b===356)return 2;if(b-a===382)return 1;return 0}
const _ny={};
function newYear(y){return _ny[y]!=null?_ny[y]:(_ny[y]=EPOCH+elapsed(y)+corr(y))}
function daysInYear(y){return newYear(y+1)-newYear(y)}
function monthLen(y,m){
  if(m===2||m===4||m===6||m===10||m===13)return 29;
  if(m===12&&!leap(y))return 29;
  const dy=daysInYear(y);
  if(m===8&&dy%10!==5)return 29;
  if(m===9&&dy%10===3)return 29;
  return 30;
}
function h2f(y,m,d){
  let t=newYear(y)+d-1;
  if(m<7){for(let i=7;i<=lastMonth(y);i++)t+=monthLen(y,i);for(let i=1;i<m;i++)t+=monthLen(y,i)}
  else{for(let i=7;i<m;i++)t+=monthLen(y,i)}
  return t;
}
function f2h(f){
  let y=Math.floor((f-EPOCH)/365.2468)+1;
  while(newYear(y)>f)y--;
  while(newYear(y+1)<=f)y++;
  let m=f<h2f(y,1,1)?7:1;
  while(f>h2f(y,m,monthLen(y,m)))m++;
  return {y,m,d:f-h2f(y,m,1)+1};
}
function g2f(y,m,d){return Math.floor(Date.UTC(y,m-1,d)/864e5)+UNIX_RD}
function f2g(f){const dt=new Date((f-UNIX_RD)*864e5);return {y:dt.getUTCFullYear(),m:dt.getUTCMonth()+1,d:dt.getUTCDate()}}
function dow(f){return ((f%7)+7)%7}   // 0=ראשון ... 6=שבת
function todayF(){const n=new Date();return g2f(n.getFullYear(),n.getMonth()+1,n.getDate())}

function gem(n,mark=true){
  const ones=['','א','ב','ג','ד','ה','ו','ז','ח','ט'],tens=['','י','כ','ל','מ','נ','ס','ע','פ','צ'],hund=['','ק','ר','ש'];
  let s='';
  while(n>=400){s+='ת';n-=400}
  if(n>=100){s+=hund[Math.floor(n/100)];n%=100}
  if(n===15)s+='טו';else if(n===16)s+='טז';else s+=tens[Math.floor(n/10)]+ones[n%10];
  if(!mark)return s;
  return s.length===1?s+"'":s.slice(0,-1)+'"'+s.slice(-1);
}
function yearName(y){return gem(y%1000)}

function resolveMonth(code,y){if(code===12||code===13)return leap(y)?13:12;if(code===14)return 12;return code}
function hfix(y,code,d){const m=resolveMonth(code,y);return h2f(y,m,Math.min(d,monthLen(y,m)))}

function buildYear(hy){
  const ev=new Map(), on=k=>S.hol[k]!==false;
  const add=(f,k,name,cat)=>{if(!on(k))return;if(!ev.has(f))ev.set(f,[]);ev.get(f).push({name,cat,k})};
  const H=(m,d)=>h2f(hy,m,d);
  const adar=leap(hy)?13:12;
  add(H(7,1),'rosh_hashana',"ראש השנה - א'",'yomtov');add(H(7,2),'rosh_hashana',"ראש השנה - ב'",'yomtov');
  let g=H(7,3);if(dow(g)===6)g++;add(g,'tzom_gedalia','צום גדליה','fast');
  add(H(7,9),'erev_yk','ערב יום כיפור','minor');add(H(7,10),'yom_kippur','יום כיפור','yomtov');
  add(H(7,14),'erev_sukkot','ערב סוכות','minor');add(H(7,15),'sukkot','סוכות','yomtov');
  for(let i=16;i<=20;i++)add(H(7,i),'chol_sukkot','חוה"מ סוכות','chol');
  add(H(7,21),'hoshana_raba','הושענא רבה','chol');add(H(7,22),'simchat_torah','שמיני עצרת - שמחת תורה','yomtov');
  const ch=H(9,25);for(let i=0;i<8;i++)add(ch+i,'chanukah','חנוכה - נר '+gem(i+1),'minor');
  add(H(10,10),'asara_tevet','עשרה בטבת','fast');
  add(H(11,15),'tu_bishvat','ט"ו בשבט','minor');
  if(leap(hy))add(H(12,14),'purim_katan','פורים קטן','minor');
  let te=H(adar,13);if(dow(te)===6)te-=2;add(te,'taanit_esther','תענית אסתר','fast');
  add(H(adar,14),'purim','פורים','minor');add(H(adar,15),'shushan_purim','שושן פורים','minor');
  add(H(1,14),'erev_pesach','ערב פסח','minor');add(H(1,15),'pesach','פסח','yomtov');
  for(let i=16;i<=20;i++)add(H(1,i),'chol_pesach','חוה"מ פסח','chol');
  add(H(1,21),'shvii_pesach','שביעי של פסח','yomtov');
  const om=H(1,16);for(let i=0;i<49;i++)add(om+i,'omer','ספירת העומר: יום '+(i+1),'omer');
  add(H(2,18),'lag_baomer','ל"ג בעומר','minor');
  add(H(3,5),'erev_shavuot','ערב שבועות','minor');add(H(3,6),'shavuot','שבועות','yomtov');
  let t=H(4,17);if(dow(t)===6)t++;add(t,'shiva_asar_tamuz','שבעה עשר בתמוז','fast');
  let a=H(5,9);if(dow(a)===6)a++;add(a,'tisha_bav','תשעה באב','fast');
  add(H(5,15),'tu_bav','ט"ו באב','minor');
  // ראש חודש
  for(let m=1;m<=lastMonth(hy);m++){if(m===7)continue;const f1=H(m,1),nm='ר"ח '+hmName(hy,m);
    if(f2h(f1-1).d===30)add(f1-1,'rosh_chodesh',nm,'rc');add(f1,'rosh_chodesh',nm,'rc')}
  // ימים לאומיים
  let sh=H(1,27);if(dow(sh)===5)sh--;else if(dow(sh)===0)sh++;add(sh,'yom_hashoah','יום השואה','national');
  let ya=H(2,5);const dy=dow(ya);if(dy===5)ya--;else if(dy===6)ya-=2;else if(dy===1)ya++;
  add(ya-1,'yom_hazikaron','יום הזיכרון','national');add(ya,'yom_haatzmaut','יום העצמאות','national');
  add(H(2,28),'yom_yerushalayim','יום ירושלים','national');
  // חגים שהמשתמש הוסיף
  for(const c of S.custom){if(c.off)continue;const f=hfix(hy,c.m,c.d);if(!ev.has(f))ev.set(f,[]);ev.get(f).push({name:c.name,cat:'custom',k:'c_'+c.id})}
  return ev;
}

function bhzOf(f){
  const hy=f2h(f).y;
  for(const y of [hy-1,hy])for(const p of S.bhz){

    const a=hfix(y,p.fm,p.fd);let b=hfix(y,p.tm,p.td);if(b<a)b=hfix(y+1,p.tm,p.td);

  }
  return null;
}

function wkNameCap(){const w=innerWidth,h=innerHeight;if(w<820||h<500)return 0;return h>=700?5:h>=600?4:3}
let wkLastCap=-1;
addEventListener('resize',()=>{if(mode==='week'){const c=wkNameCap();if(c!==wkLastCap){wkLastCap=c;render()}}});
function renderGrid(){
  if(mode==='week')wkLastCap=wkNameCap();
  $('grid').className='grid g-'+mode;
  $('vHeb').classList.toggle('on',S.view==='heb');$('vGreg').classList.toggle('on',S.view==='greg');
  let first,last;
  if(mode==='week'){
    first=curF-dow(curF);last=first+6;
    const a=f2h(first),b=f2h(last),ga=f2g(first),gb=f2g(last);
    $('mt').textContent=hmName(a.y,a.m)+(a.m!==b.m?' – '+hmName(b.y,b.m):'')+' '+yearName(b.y);
    $('ms').textContent=ga.d+(ga.m!==gb.m?' '+GM[ga.m]:'')+' – '+gb.d+' '+GM[gb.m]+' '+gb.y;
  }else if(S.view==='heb'){
    if(cur.hm===13&&!leap(cur.hy))cur.hm=12;
    first=h2f(cur.hy,cur.hm,1);last=first+monthLen(cur.hy,cur.hm)-1;
    $('mt').textContent=hmName(cur.hy,cur.hm)+' '+yearName(cur.hy);
    const a=f2g(first),b=f2g(last);
    $('ms').textContent=a.m===b.m?GM[a.m]+' '+a.y:GM[a.m]+(a.y!==b.y?' '+a.y:'')+' – '+GM[b.m]+' '+b.y;
  }else{
    first=g2f(cur.gy,cur.gm,1);last=g2f(cur.gm===12?cur.gy+1:cur.gy,cur.gm===12?1:cur.gm+1,1)-1;
    $('mt').textContent=GM[cur.gm]+' '+cur.gy;
    const a=f2h(first),b=f2h(last);
    $('ms').textContent=a.m===b.m?hmName(a.y,a.m)+' '+yearName(a.y):hmName(a.y,a.m)+(a.y!==b.y?' '+yearName(a.y):'')+' – '+hmName(b.y,b.m)+' '+yearName(b.y);
  }
  $('wd').innerHTML=WD.map((w,i)=>`<div class="${i===6?'sh':''}">${w}</div>`).join('');
  const start=first-dow(first),end=last+(6-dow(last));
  let html='';
  for(let f=start;f<=end;f++){
    const h=f2h(f),g=f2g(f),evs=eventsOf(f),bz=bhzOf(f);
    const cls=['cell'];
    if(f<first||f>last)cls.push('out');
    if(dow(f)===6)cls.push('shabbat');
    if(evs.some(e=>e.cat==='yomtov'))cls.push('yomtov');else if(evs.some(e=>e.cat==='chol'))cls.push('chol');
    if(f===T)cls.push('today');
    if(bz)cls.push('bhz');
    const showMonthG=S.view==='heb'&&(g.d===1||f===start);
    const showMonthH=S.view==='greg'&&(h.d===1||f===start);
    let inner='';
    if(bz)inner+=`<div class="bhzband">${(bz.first||dow(f)===0||f===start)?esc(bz.name):''}</div>`;
    inner+=`<div class="dn"><span class="hd">${gem(h.d)}${showMonthH?` <small style="font-size:12px;font-weight:600">${hmName(h.y,h.m)}</small>`:''}</span><span class="gwrap">${showMonthG?`<small>${GM[g.m]}</small>`:''}<span class="gnum">${g.d}</span></span></div>`;
    const pr=parashaOf(f);if(pr)inner+=`<div class="chip c-shabbat">פרשת ${pr}</div>`;
    if(S.z&&S.z.show){const zc=S.z.cell;
      if(zc.candle&&isRest(f+1)&&!isRest(f))inner+=`<div class="chip c-zman">הדלקת נרות ${zt(f,'candle')}</div>`;
      if(zc.havdala&&isRest(f)&&!isRest(f+1))inner+=`<div class="chip c-zman">יציאה ${zt(f,'motzash')}${zc.rt?` · ר"ת ${zt(f,'rt')}`:''}</div>`;
      const ci=mode==='week'?Object.assign({netz:true,shkia:true},S.z.cellItems||{}):(S.z.cellItems||{}),picks=ZDEF.filter(r=>ci[r[0]]);
      if(picks.length)inner+=`<div class="zsun">${picks.map(r=>`<span>${ZSHORT[r[0]]} <b>${zt(f,r[0])}</b></span>`).join('')}</div>`;}
    for(const e of evs)if(e.cat!=='omer')inner+=`<div class="chip c-${e.cat}">${esc(e.name)}</div>`;
    for(const o of personalOf(f)){const t=ETYPES[o.e.type]||ETYPES.reminder;inner+=`<div class="chip ${t.cls}">${t.ico}${esc(pLabel(o))}</div>`}
    const sc=schedFor(dow(f),'cal',f);
    if(sc.length){const scCap=mode==='week'?(wkNameCap()>0?6:3):2;
      for(const it of sc.slice(0,scCap))inner+=`<div class="chip c-sch" style="background:${it.color};color:${textOn(it.color)}">${it.start} ${esc(it.title)}</div>`;
      if(sc.length>scCap)inner+=`<div class="chip c-sch more">+${sc.length-scCap} במערכת</div>`}
    const hl=hilulaOf(f);
    const cap=mode==='week'?wkNameCap():0;
    if(hl.length&&cap>0){   // יש מקום: שמות (המסומנים בכוכב קודם), ואם יש יותר - "ועוד N"
      const ord=hl.filter(isFav).concat(hl.filter(i=>!isFav(i)));
      for(const i of ord.slice(0,cap))inner+=`<div class="chip ${isFav(i)?'c-yahr':'c-hil'}">${IC_CANDLE}${esc(wkTrim(shortName(HILULA[i][2])))}</div>`;
      if(ord.length>cap)inner+=`<div class="chip c-hil">ועוד ${ord.length-cap}</div>`;
    }else
    if(hl.length){const fv=hl.filter(isFav),rest=hl.length-fv.length;
      for(const i of fv)inner+=`<div class="chip c-yahr">${IC_CANDLE}${esc(shortName(HILULA[i][2]))}</div>`;
      if(rest)inner+=`<div class="chip c-hil">${IC_CANDLE}${rest===1&&!fv.length?esc(shortName(HILULA[hl[0]][2])):(fv.length?'ועוד ':'')+rest+' ימי הילולא'}</div>`}
    const om=evs.find(e=>e.cat==='omer');if(om)inner+=`<div class="omer">${om.name}</div>`;
    html+=`<div class="${cls.join(' ')}" data-f="${f}">${inner}</div>`;
  }
  $('grid').innerHTML=html;
  $('legend').innerHTML=[['#f3d79a','יום טוב'],['#fde8bd','חול המועד'],['var(--fast)','תענית'],['var(--minor)','יום מיוחד'],['var(--rc)','ראש חודש'],['var(--nat)','יום לאומי'],['var(--custom)','חג שהוספתי'],['var(--bhz)','בין הזמנים'],['#efe6d6','יום פטירה / צדיק מסומן'],['#f6f1e7','ימי הילולא'],['#fde3ec','יום הולדת'],['#e3eefc','תזכורת']]
    .map(([c,t])=>`<span><span class="sw" style="background:${c}"></span>${t}</span>`).join('');
}

function openDay(f){
  const h=f2h(f),g=f2g(f),evs=eventsOf(f),bz=bhzOf(f);
  let s=`<div class="big">יום ${WD[dow(f)]}, ${gem(h.d)} ${hmName(h.y,h.m)} ${yearName(h.y)}</div>
         <div class="muted" style="font-size:15px;margin-top:2px">${g.d} ב${GM[g.m]} ${g.y}</div><div class="chips">`;
  const pr=parashaOf(f);if(pr)s+=`<div class="chip c-shabbat">פרשת ${pr}</div>`;
  if(bz)s+=`<div class="chip" style="background:var(--bhz-bg);color:var(--bhz)">${esc(bz.name)}</div>`;
  for(const e of evs)s+=`<div class="chip c-${e.cat==='omer'?'minor':e.cat}">${esc(e.name)}</div>`;
  const ps=personalOf(f);
  for(const o of ps){const t=ETYPES[o.e.type]||ETYPES.reminder;
    s+=`<div class="chip ${t.cls}" style="display:flex;align-items:center;gap:6px">${t.ico}<span style="flex:1">${t.n}: ${esc(pLabel(o))}${o.e.note?`<br><span style="font-weight:400;font-size:13px">${esc(o.e.note)}</span>`:''}</span><span class="lnk2" data-edit="${o.e.id}">עריכה</span></div>`}
  const hl=hilulaOf(f);
  if(S.z&&S.z.show){
    const rows=[];
    if(isRest(f+1)&&!isRest(f)&&S.z.items.candle.on)rows.push(['הדלקת נרות',zt(f,'candle'),1]);
    for(const [k,n] of ZDEF)if(S.z.items[k].on)rows.push([n,zt(f,k)]);
    if(isRest(f)&&!isRest(f+1)){if(S.z.items.motzash.on)rows.push(['יציאת '+(dow(f)===6?'שבת':'חג'),zt(f,'motzash'),1]);if(S.z.items.rt.on)rows.push(['רבנו תם',zt(f,'rt'),1])}
    if(rows.length)s+=`</div><div style="margin-top:14px;font-weight:700;color:var(--accent)">זמני היום – ${esc(S.z.city)}</div><div class="ztable">${rows.map(([n,t,b])=>`<div class="${b?'zb':''}"><span>${n}</span><b>${t}</b></div>`).join('')}</div><div class="muted" style="margin-top:4px">הזמנים מחושבים לפי ההגדרות שבלשונית "זמנים". לזמנים למעשה יש לבדוק בלוח מוסמך.</div><div>`;
  }
  if(!pr&&!bz&&!evs.length&&!ps.length&&!hl.length)s+=`<div class="empty">אין מועדים ביום זה.</div>`;
  if(hl.length){s+=`</div><div style="margin-top:14px;font-weight:700;color:var(--accent)">ימי הילולא (${hl.length})</div><div class="muted">לחיצה על הכוכב מסמנת צדיק להזכרה ולהצגה בולטת בלוח.</div><div class="hil-list">`;
    for(const i of hl)s+=`<div class="hil-row${isFav(i)?' on':''}"><button class="st" data-fav="${i}" title="סימון להזכרה">${IC_STAR(isFav(i))}</button><span>${esc(HILULA[i][2])}</span></div>`}
  s+=`</div><div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-addday="${f}">הוספת פטירה / יום הולדת / תזכורת ביום זה</button><button class="btn" data-gotoday="${f}">תצוגה יומית של היום הזה</button></div>`;
  $('dayBody').innerHTML=s;$('dayOv').classList.add('open');
}

/* ================= הגדרות ================= */
let tab='hol';
const dayOpts=sel=>Array.from({length:30},(_,i)=>`<option value="${i+1}"${sel===i+1?' selected':''}>${gem(i+1)}</option>`).join('');
const monOpts=sel=>MCODES.map(([c,n])=>`<option value="${c}"${sel===c?' selected':''}>${n}</option>`).join('');

function renderSet(){
  document.querySelectorAll('#setTabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  let s='';
  if(tab==='hol'){
    s+=`<p class="muted" style="margin-top:0">סמן את המועדים שיוצגו בלוח. השינוי נשמר מיד.</p>`;
    HOLS.forEach((grp,gi)=>{
      s+=`<div class="grp"><h3>${grp.g}<span><span class="lnk" data-all="${gi}" data-val="1">סמן הכל</span><span class="lnk" data-all="${gi}" data-val="0">בטל הכל</span></span></h3><div class="checks">`;
      for(const [k,n] of grp.items)s+=`<label><input type="checkbox" data-hk="${k}"${S.hol[k]!==false?' checked':''}> ${n}</label>`;
      s+='</div></div>';
    });
    s+=`<div class="grp"><h3>פרשת השבוע</h3><div class="row"><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="parShow"${S.showParasha!==false?' checked':''}> הצגת פרשת השבוע בשבתות (מנהג ארץ ישראל)</label></div></div>`;
    s+=`<div class="grp"><h3>ימי הילולא דצדיקיא</h3><div class="row">
      <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="hilShow"${S.hil.show?' checked':''}> הצגת ימי הילולא בלוח</label></div>
      <div class="row"><span>ימי הילולא שבחודש אדר, בשנה מעוברת יוצגו ב:</span><select id="hilAdar"><option value="b"${S.hil.adar!=='a'?' selected':''}>אדר ב'</option><option value="a"${S.hil.adar==='a'?' selected':''}>אדר א'</option></select></div></div>`;
  }else if(tab==='custom'){
    s+=`<p class="muted" style="margin-top:0">חג או יום מיוחד שחוזר כל שנה באותו תאריך עברי. יופיע בלוח בצבע טורקיז.</p>
      <div class="grp"><h3>הוספת יום</h3><div class="row">
      <input type="text" id="cName" placeholder="שם היום">
      <select id="cDay">${dayOpts(1)}</select><select id="cMon">${monOpts(7)}</select>
      <button class="btn primary" id="cAdd">הוספה</button></div></div><div class="grp list"><h3>הימים שהוספתי</h3>`;
    if(!S.custom.length)s+=`<div class="empty">עדיין לא נוספו ימים.</div>`;
    for(const c of S.custom)s+=`<div class="item"><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-coff="${c.id}"${c.off?'':' checked'}> <b>${esc(c.name)}</b></label>
       <span class="muted">${gem(c.d)} ${MCODES.find(x=>x[0]===c.m)[1]}</span><span style="flex:1"></span><button class="btn danger" data-cdel="${c.id}">מחיקה</button></div>`;
    s+='</div>';
  }else if(tab==='zm'){
    const Z=S.z,inp='padding:6px;border:1px solid var(--line);border-radius:8px;width:90px';
    const row=([k,n,m0])=>{const o=Z.items[k];return `<div class="item"><label style="display:flex;gap:6px;align-items:center;min-width:190px"><input type="checkbox" data-zon="${k}"${o.on?' checked':''}> ${n}</label>
      ${m0==='none'?`<span class="muted">${ZNOTE[k]||'לפי השעות הזמניות'}</span>`:`<input type="number" step="0.1" data-zv="${k}" value="${o.v}" style="${inp}"><select data-zm="${k}" style="padding:6px;border:1px solid var(--line);border-radius:8px;min-width:120px">${Object.entries(ZMETHOD).filter(([mk])=>k!=='candle'||mk==='min').map(([mk,mn])=>`<option value="${mk}"${o.m===mk?' selected':''}>${mn}</option>`).join('')}</select>
      <span class="muted">${k==='candle'?'לפני השקיעה':['alot','tefillin'].includes(k)?'לפני הנץ (מעלות: מתחת לאופק)':'אחרי השקיעה (מעלות: מתחת לאופק)'}</span>`}${ZSHORT[k]?`<label class="zcell"><input type="checkbox" data-zcell="${k}"${(Z.cellItems||{})[k]?' checked':''}> במשבצת</label>`:''}</div>`};
    s+=`<div class="grp"><h3>מיקום ותצוגה</h3><div class="row"><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="zShow"${Z.show?' checked':''}> הצגת זמנים בלוח</label></div>
      <div class="row"><span>מיקום:</span><select id="zCity">${Object.keys(CITIES).map(c=>`<option${Z.city===c?' selected':''}>${c}</option>`).join('')}<option value="__"${CITIES[Z.city]?'':' selected'}>מיקום אחר</option></select>
      <span>קו רוחב</span><input type="number" step="0.001" id="zLat" value="${Z.lat}" style="${inp}"><span>קו אורך</span><input type="number" step="0.001" id="zLon" value="${Z.lon}" style="${inp}"></div>
      <div class="row"><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="zUseElev"${Z.useElev?' checked':''}> זריחה ושקיעה לפי גובה המקום</label>
      <span>גובה במטרים</span><input type="number" id="zElev" value="${Z.elev}" style="${inp}"><span class="muted">ללא סימון: לפי גובה פני הים</span></div></div>
      <div class="grp list"><h3>זמני היום</h3><p class="muted" style="margin:0 0 4px">הסימון שליד השם: להציג בפרטי היום (בלחיצה על יום). הסימון "במשבצת": להציג גם בכל משבצת בלוח.</p>${ZDEF.map(row).join('')}</div>
      <div class="grp list"><h3>שבת וחג</h3>${ZSHAB.map(row).join('')}
      <div class="row" style="margin-top:8px"><span>במשבצת בלוח:</span>
      <label style="display:flex;gap:5px;align-items:center"><input type="checkbox" data-zc="candle"${Z.cell.candle?' checked':''}> הדלקת נרות</label>
      <label style="display:flex;gap:5px;align-items:center"><input type="checkbox" data-zc="havdala"${Z.cell.havdala?' checked':''}> יציאת שבת/חג</label>
      <label style="display:flex;gap:5px;align-items:center"><input type="checkbox" data-zc="rt"${Z.cell.rt?' checked':''}> רבנו תם</label></div></div>
      <div class="row"><button class="btn" id="zmDefaults">החזרת ברירות המחדל של הזמנים</button></div>
      <p class="muted">עיגול: זמני סוף, הנץ והשקיעה מעוגלים לדקה שלפני, וזמני התחלה בערב לדקה שאחרי. הזמנים מחושבים, ולזמנים למעשה יש לבדוק בלוח מוסמך.</p>`;
  }else if(tab==='rem'){
    s+=`<div class="grp"><h3>תזכורות קופצות</h3>
      <div class="row"><span>שעת הקפצת התזכורות היומית:</span><input type="time" id="remTime" value="${S.remTime||'08:00'}" style="padding:6px;border:1px solid var(--line);border-radius:8px"></div>
      <p class="muted">אם המחשב נדלק אחרי השעה הזו, התזכורות יקפצו מיד עם ההפעלה. תזכורת קופצת לרשומות שסומן בהן "להקפיץ תזכורת" ולצדיקים שסומנו בכוכב.</p>
      <div class="row"><button class="btn primary" id="remTest"${SERVER?'':' disabled'}>הקפצת תזכורת לבדיקה</button>
      ${SERVER?'':'<span class="muted">פועל רק כשהלוח נפתח מקיצור הדרך "לוח זמנים".</span>'}</div><div id="remMsg"></div>
      <div class="row" style="margin-top:6px"><span>תזכורת מקדימה לצדיקים שסומנו בכוכב:</span>${preBoxes('h',(S.hil&&S.hil.pre)||[])}</div>
      <div class="row" style="margin-top:6px"><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="popupFlip"${S.popupFlip?' checked':''}> בחלון הקופץ האותיות מופיעות בסדר הפוך (סמן לתיקון)</label></div></div>
      <div class="grp"><h3>גיבוי ושחזור</h3>
      <p class="muted">הגיבוי שומר את כל הרשומות, הצדיקים המסומנים וההגדרות בקובץ אחד. אפשר גם להעביר בעזרתו נתונים מגרסה קודמת של הלוח.</p>
      <div class="row"><button class="btn" id="bkExp">שמירת גיבוי לקובץ</button><button class="btn" id="bkImpBtn">שחזור מגיבוי</button><input type="file" id="bkImp" accept=".json,application/json" style="display:none"></div><div id="bkMsg"></div></div>`;
  }else{
    s+=`<p class="muted" style="margin-top:0">כל תקופה מסומנת בלוח כפס ירוק. התאריכים כוללים את יום ההתחלה ואת יום הסיום. אם החודש קצר מהיום שנבחר (למשל ל' בחודש של 29 יום), יילקח היום האחרון בחודש.</p><div class="grp list">`;
    if(!S.bhz.length)s+=`<div class="empty">אין תקופות.</div>`;
    for(const p of S.bhz)s+=`<div class="item">
      <input type="checkbox" data-boff="${p.id}"${p.off?'':' checked'} title="הצגה בלוח">
      <input type="text" data-bn="${p.id}" value="${esc(p.name)}" style="flex:1;min-width:150px;padding:7px 9px;border:1px solid var(--line);border-radius:8px">
      <span>מ-</span><select data-b="${p.id}" data-f="fd">${dayOpts(p.fd)}</select><select data-b="${p.id}" data-f="fm">${monOpts(p.fm)}</select>
      <span>עד</span><select data-b="${p.id}" data-f="td">${dayOpts(p.td)}</select><select data-b="${p.id}" data-f="tm">${monOpts(p.tm)}</select>
      <button class="btn danger" data-bdel="${p.id}">מחיקה</button></div>`;
    s+=`</div><div class="row"><button class="btn primary" id="bAdd">הוספת תקופה</button><button class="btn" id="bReset">שחזור ברירת המחדל</button></div>`;
  }
  $('setBody').innerHTML=s;
}

$('setBody').addEventListener('change',e=>{
  const t=e.target,d=t.dataset;
  if(t.id==='bkImp'){
    const file=t.files[0];if(!file)return;const rd=new FileReader();
    rd.onload=()=>{try{const j=JSON.parse(rd.result);if(!j||j.v!==1||!Array.isArray(j.events))throw 0;

function setYearHint(){const trip=$('eType').value==='trip',h=trip?'שנה (חובה לטיול)':'שנה (לא חובה)';$('eHy').placeholder=h;$('eGy').placeholder=h}
function syncMode(){
  const m=$('eMode').value;
  document.querySelectorAll('#evBody .hb').forEach(x=>x.style.display=m==='greg'?'none':'');
  document.querySelectorAll('#evBody .gb').forEach(x=>x.style.display=m==='heb'?'none':'');

function formMsg(t,ok){$('eMsg').innerHTML=`<div class="msg ${ok?'ok':'err'}">${t}</div>`}
function readForm(){
  const name=$('eName').value.trim(),mode=$('eMode').value;
  if(!name){formMsg('יש למלא שם.');return null}
  const hyRaw=$('eHy').value.trim(),hy=hyRaw?parseHebYear(hyRaw):null;
  if(mode!=='greg'&&hyRaw&&(isNaN(hy)||hy<3000||hy>6500)){formMsg('השנה העברית לא זוהתה. כתוב למשל תשנ"ה או 5755, או השאר ריק.');return null}
  const gyRaw=$('eGy').value.trim(),gy=gyRaw?+gyRaw:null;
  if(mode!=='heb'&&gyRaw&&!(gy>=1000&&gy<=2300)){formMsg('השנה הלועזית לא תקינה.');return null}
  if($('eType').value==='trip'){
    if(mode!=='greg'&&!hy){formMsg('טיול הוא חד־פעמי, ולכן חובה למלא את השנה העברית.');return null}
    if(mode!=='heb'&&!gy){formMsg('טיול הוא חד־פעמי, ולכן חובה למלא את השנה הלועזית.');return null}
  }
  const r={type:$('eType').value,name,note:$('eNote').value.trim(),mode,remind:$('eRem').checked,pre:readPre('e')};
  if(mode!=='greg'){r.hd=+$('eHd').value;r.hm=+$('eHm').value;r.hy=hy}
  if(mode!=='heb'){r.gd=+$('eGd').value;r.gm=+$('eGm').value;r.gy=gy;
    const maxd=[0,31,29,31,30,31,30,31,31,30,31,30,31][r.gm];if(r.gd>maxd){formMsg('אין '+r.gd+' ימים בחודש '+GM[r.gm]+'.');return null}}
  return r;
}

  }

      if(S.events.some(x=>x.type===type&&x.name===p.name&&x.mode===p.mode&&x.hm===p.hm&&x.hd===p.hd&&x.gm===p.gm&&x.gd===p.gd)){dup++;continue}

  }

const tmin=t=>{const [h,m]=String(t).split(':').map(Number);return h*60+(m||0)};

function schedLanes(list){   // בלוקים חופפים באותו יום - זה לצד זה

  for(const a of out){const g=out.filter(b=>b.s<a.e&&a.s<b.e);a.n=Math.max(...g.map(b=>b.l))+1}
  return out;

  if(SV.mode==='week'){

function scMove(dir){

  o+=`</div><div class="sc-body" style="${gt};height:${H}px;--hh:${HH}px"><div class="sc-hours">`;
  for(let m=mn;m<=mx;m+=60)o+=`<span style="top:${(m-mn)/60*HH}px">${mtime(m%1440)}</span>`;
  o+='</div>';

    for(const b of schedLanes(schedOn(f))){const it=b.it,top=(b.s-mn)/60*HH,h=Math.max(24,(b.e-b.s)/60*HH-2);

         `<em>${it.cal?'▦':''}${it.rem?'⏰':''}</em><b>${esc(it.title)}</b><small>${it.start}–${it.end}</small>`+
         (h>=66&&it.note?`<p>${esc(it.note)}</p>`:'')+`</div>`}

function drawMonth(){
  const g=f2g(SV.f),first=g2f(g.y,g.m,1),dim=new Date(g.y,g.m,0).getDate(),last=first+dim-1;
  const w0=first-dow(first),weeks=Math.ceil((last-w0+1)/7),CAP=innerHeight>=820?4:3;

  for(let f=w0;f<w0+weeks*7;f++){

    if (!pubKey) pubKey = crypto.subtle.importKey('raw', new Uint8Array(PUB.match(/../g).map(function (x) { return parseInt(x, 16); })), { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);
    return pubKey;
  }
  /* מחזיר Promise עם המספר הסידורי אם הקוד תקין, אחרת null */
  function verify(code) {
    return new Promise(function (res) {
      try {
        var b = b32dec(code); if (!b || b.length < 68) return res(null);
        b = b.slice(0, 68);
        var serial = ((b[0] << 24) | (b[1] << 16) | (b[2] << 8) | b[3]) >>> 0, sig = b.slice(4);
        getKey().then(function (k) {
          return crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, k, sig, new TextEncoder().encode('nd-ads-v1:' + serial));
        }).then(function (ok) { res(ok ? serial : null); }, function () { res(null); });
      } catch (e) { res(null); }
    });
  }

  var bar = null, pop = null, dlg = null, idleT = 0, pollT = 0, last = Date.now(), unlocked = false;
  /* בעורך סגנונות: אין קוד ב-20 ש"ח. רכישת העורך המלא (הפעלה) מסירה את הפרסומות */
  var EDITOR = (typeof isActivated === 'function' && typeof licBoot !== 'undefined');
  var BTN = EDITOR ? 'לרכישת העורך המלא' : 'הסרת פרסומות · ' + PRICE;
  function onBtn() { if (EDITOR) { try { requireActivation(function () {}); } catch (e) {} } else openDlg(); }
  var CSS = '' +
    '.ndad,.ndad *{box-sizing:border-box;font-family:"Segoe UI","Rubik","Heebo",Arial,sans-serif}' +
    '#ndad-bar{position:sticky;bottom:0;z-index:2147483000;flex:0 0 auto;direction:rtl;display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap;' +
    'padding:7px 14px;min-height:38px;background:linear-gradient(90deg,#18304f,#244a78);color:#f3ead2;font-size:14px;line-height:1.35;border-top:1px solid rgba(255,255,255,.18)}' +
    '#ndad-bar b{color:#ffd978}#ndad-bar a{color:#ffd978;font-weight:700;text-decoration:none;border-bottom:1px dotted #ffd978}#ndad-bar a:hover{color:#fff}' +
    '#ndad-bar button,#ndad-pop button.nd{font:inherit;font-size:13px;font-weight:700;border:0;border-radius:7px;padding:4px 12px;background:#ffd978;color:#18304f;cursor:pointer}' +
    '#ndad-bar button:hover,#ndad-pop button.nd:hover{background:#fff}' +
    '#ndad-pop{position:fixed;left:16px;bottom:56px;z-index:2147483001;width:min(330px,calc(100vw - 32px));direction:rtl;background:#18304f;color:#f3ead2;border:1px solid #ffd978;border-radius:12px;' +
    'padding:14px 16px 13px;box-shadow:0 10px 30px rgba(0,0,0,.35);font-size:14px;line-height:1.5;opacity:0;transform:translateY(14px);transition:opacity .35s,transform .35s}' +
    '#ndad-pop.on{opacity:1;transform:none}#ndad-pop h4{margin:0 0 4px;font-size:15px;color:#ffd978}#ndad-pop p{margin:0 0 10px}' +
    '#ndad-pop .x{position:absolute;top:5px;left:8px;background:none!important;border:0;color:#f3ead2!important;font-size:20px!important;line-height:1;cursor:pointer;padding:2px 6px!important}' +
    '#ndad-pop .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#ndad-pop a{color:#ffd978;font-weight:700}' +
    '#ndad-dlg{position:fixed;inset:0;z-index:2147483002;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;direction:rtl;padding:14px}' +
    '#ndad-dlg .box{background:#fff;color:#2a2620;border-radius:14px;width:min(480px,100%);padding:20px 22px;box-shadow:0 20px 50px rgba(0,0,0,.4);font-size:15px;line-height:1.6}' +
    '#ndad-dlg h3{margin:0 0 6px;font-size:19px;color:#18304f}#ndad-dlg p{margin:0 0 10px}' +
    '#ndad-dlg textarea{width:100%;height:78px;direction:ltr;text-align:left;font-family:"Courier New",monospace;font-size:13px;padding:8px;border:1px solid #bbb;border-radius:8px;resize:none}' +
    '#ndad-dlg .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}' +
    '#ndad-dlg button{font:inherit;font-weight:700;border:0;border-radius:8px;padding:8px 16px;cursor:pointer;background:#18304f;color:#fff}#ndad-dlg button.alt{background:#e9e3d6;color:#2a2620}' +
    '#ndad-dlg a{color:#244a78;font-weight:700}#ndad-msg{min-height:22px;font-weight:700;margin-top:8px}#ndad-msg.ok{color:#2f6b4f}#ndad-msg.err{color:#a4453a}' +
    '@media print{#ndad-bar,#ndad-pop,#ndad-dlg{display:none!important}}';

  function el(tag, id, html, parent) { var e = document.createElement(tag); if (id) e.id = id; e.className = 'ndad'; if (html != null) e.innerHTML = html; (parent || document.body).appendChild(e); return e; }
  function mailHref() { return 'mailto:' + MAIL + '?subject=' + encodeURIComponent('הסרת פרסומות - ' + PRICE) + '&body=' + encodeURIComponent('שלום, אני מעוניין בקוד להסרת הפרסומות (' + PRICE + ').'); }

  function openDlg() {
    if (dlg) return;
    dlg = el('div', 'ndad-dlg',
      '<div class="box"><h3>הסרת הפרסומות — ' + PRICE + ' חד־פעמי</h3>' +
      '<p>תשלום חד־פעמי, והפרסומות נעלמות מכל התוכנות של netivdosIL. לתשלום ולקבלת קוד פנו אלינו:</p>' +
      '<p>✉ <a href="' + mailHref() + '">' + MAIL + '</a> &nbsp; ☎ <a href="tel:' + PHONE.replace(/-/g, '') + '">' + PHONE + '</a></p>' +
      '<p>קיבלתם קוד? הדביקו אותו כאן:</p><textarea id="ndad-code" spellcheck="false" placeholder="ND-XXXXXX-XXXXXX-..."></textarea>' +
      '<div id="ndad-msg"></div><div class="row"><button type="button" id="ndad-ok">הסר פרסומות</button><button type="button" class="alt" id="ndad-cancel">סגירה</button></div></div>');
    var close = function () { if (dlg) { dlg.remove(); dlg = null; } };
    dlg.addEventListener('mousedown', function (e) { if (e.target === dlg) close(); });
    dlg.querySelector('#ndad-cancel').onclick = close;
    var ta = dlg.querySelector('#ndad-code'), msg = dlg.querySelector('#ndad-msg');
    dlg.querySelector('#ndad-ok').onclick = function () {
      var c = ta.value.trim();
      if (!c) { msg.className = 'err'; msg.textContent = 'הדביקו את הקוד שקיבלתם'; return; }
      if (!(window.crypto && crypto.subtle)) { msg.className = 'err'; msg.textContent = 'הדפדפן לא תומך באימות. פתחו את התוכנה בדפדפן עדכני.'; return; }
      verify(c).then(function (sn) {
        if (sn == null) { msg.className = 'err'; msg.textContent = 'הקוד אינו תקין. בדקו שהועתק במלואו.'; return; }
        ls(KEY_CODE, c); msg.className = 'ok'; msg.textContent = '✓ הפרסומות הוסרו. תודה!';
        setTimeout(function () { close(); removeAds(); }, 900);
      });
    };
    ta.focus();
  }

  function removeAds() {
    unlocked = true; clearInterval(idleT); clearInterval(pollT);
    [bar, pop, dlg].forEach(function (e) { if (e) e.remove(); }); bar = pop = dlg = null;
    var s = document.getElementById('ndad-css'); if (s) s.remove();
    if (document.body.getAttribute('data-ndpad')) { document.body.style.paddingBottom = ''; document.body.removeAttribute('data-ndpad'); }
  }

  function showBar() {
    bar = el('div', 'ndad-bar',
      '<span>🌟 <b>netivdosIL</b> — תוכנות פשוטות לבית, לישיבה ולקהילה</span>' +
      '<a href="' + SITE + '" target="_blank" rel="noopener">לאתר</a>' +
      '<span id="ndad-note">' + (EDITOR ? 'ברכישת העורך המלא הפרסומות יוסרו' : '') + '</span>' +
      '<button type="button" id="ndad-rm">' + BTN + '</button>');
    bar.querySelector('#ndad-rm').onclick = onBtn;
    if (!EDITOR) bar.querySelector('#ndad-note').remove();
  }

  function today() { var d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  function hidePop() { if (!pop) return; var p = pop; pop = null; p.classList.remove('on'); setTimeout(function () { p.remove(); }, 400); }
  function showPop() {
    ls(KEY_DAY, today());
    pop = el('div', 'ndad-pop',
      '<button type="button" class="x" title="סגירה">×</button><h4>netivdosIL</h4>' +
      '<p>עוד תוכנות שימושיות באתר שלנו: דוח שעות, גן ילדים, עורך סגנונות ולוח זמנים.</p>' +
      '<div class="row"><a href="' + SITE + '" target="_blank" rel="noopener">מעבר לאתר</a>' +
      '<button type="button" class="nd">' + BTN + '</button></div>');
    var over = false;
    pop.addEventListener('mouseenter', function () { over = true; }); pop.addEventListener('mouseleave', function () { over = false; });
    pop.querySelector('.x').onclick = hidePop;
    pop.querySelector('.nd').onclick = function () { hidePop(); onBtn(); };
    requestAnimationFrame(function () { if (pop) pop.classList.add('on'); });
    var t = setInterval(function () { if (!pop) return clearInterval(t); if (!over) { clearInterval(t); hidePop(); } }, 18000);
  }
  function activity() { last = Date.now(); }
  function startDaily() {
    if (ls(KEY_DAY) === today()) return;
    ['keydown', 'mousedown', 'input', 'wheel', 'touchstart'].forEach(function (ev) { document.addEventListener(ev, activity, true); });
    var born = Date.now();
    idleT = setInterval(function () {
      if (unlocked) return;
      if (Date.now() - born < 25000) return;                  // לא בתחילת העבודה
      if (Date.now() - last < 5000 || dlg || pop) return;     // רק כשנחה ההקלדה, ולא מעל חלון פתוח
      if (document.hidden) return;
      clearInterval(idleT); showPop();
    }, 3000);
  }

  function start() {
    var st = document.createElement('style'); st.id = 'ndad-css'; st.textContent = CSS; document.head.appendChild(st);
    showBar();
    try {   /* בעמוד רגיל (כמו הלוח) הפס קבוע בתחתית המסך; בעמוד בנוי flex (העורך) הוא יושב מתחת לתוכן */
      if (getComputedStyle(document.body).display !== 'flex') {
        bar.style.position = 'fixed'; bar.style.left = '0'; bar.style.right = '0';
        document.body.style.paddingBottom = (parseInt(getComputedStyle(document.body).paddingBottom) || 0) + 44 + 'px'; document.body.setAttribute('data-ndpad', '1');
      }
    } catch (e) {}
    startDaily();
  }
  var saved = ls(KEY_CODE);
  function go() {
    if (EDITOR) {   /* בעורך: ההפעלה של העורך עצמו קובעת */
      Promise.resolve(licBoot).then(function () {
        try { if (isActivated()) { unlocked = true; return; } } catch (e) {}
        start();
        pollT = setInterval(function () { try { if (isActivated()) removeAds(); } catch (e) {} }, 3000);
      });
      return;
    }
    if (saved && window.crypto && crypto.subtle) { verify(saved).then(function (sn) { if (sn != null) { unlocked = true; } else { ls(KEY_CODE, null); start(); } }); }
    else start();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
  window.__ndAds = { verify: verify, open: openDlg };
})();
</script>
